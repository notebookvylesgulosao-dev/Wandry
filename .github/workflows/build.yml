name: Build Wandry
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.0
      - run: gradle build --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: wandry-jar
          path: build/libs/*.jar
      - name: Inspect mapped Minecraft API
        if: always()
        run: |
          J=$(find ~/.gradle/caches/fabric-loom/minecraftMaven/net/minecraft -name 'minecraft-merged-1.21.11-loom*.jar' | grep -v intermediary | head -1)
          echo "JAR=$J"
          unzip -l "$J" | awk '{print $4}' | grep -E '/(Snowball|ItemUseAnimation|UseAnim|Identifier|ResourceLocation|InteractionResult|InteractionResultHolder|ThrowableItemProjectile|Item|Level|Projectile|ItemSupplier)\.class$'
          for c in net.minecraft.world.item.Item net.minecraft.world.level.Level; do echo "== $c"; javap -cp "$J" -protected "$c" | grep -E "use\(|releaseUsing|getUseDuration|getUseAnimation|isClientSide|setId|Properties"; done
