name: Build Wandry
on:
  workflow_dispatch:
  push:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.0
      - run: gradle build --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: wandry-jar
          path: build/libs/*.jar
      - name: Publish release with jar
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/wandry-*.jar | grep -v sources | head -1)
          gh release delete v1.0.0 --yes --cleanup-tag || true
          gh release create v1.0.0 "$JAR" --title "Wandry 1.0.0 (Fabric 1.21.11)" --notes "Compilado com sucesso via GitHub Actions. Nao testado dentro do Minecraft."
