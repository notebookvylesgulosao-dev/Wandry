name: Build Wandry
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.0
      - run: gradle build --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: wandry-jar
          path: build/libs/*.jar
      - name: Inspect mapped Minecraft API
        if: always()
        run: |
          J=$(find ~/.gradle/caches/fabric-loom/minecraftMaven/net/minecraft -name 'minecraft-merged-1.21.11-loom*.jar' | grep -v intermediary | head -1)
          P=net.minecraft.world.entity.projectile
          for c in $P.throwableitemprojectile.Snowball $P.throwableitemprojectile.ThrowableItemProjectile $P.Projectile net.minecraft.core.particles.DustParticleOptions net.minecraft.world.InteractionResult; do echo "== $c"; javap -cp "$J" -protected "$c"; done
          echo "== Entity/LivingEntity"; javap -cp "$J" -protected net.minecraft.world.entity.Entity net.minecraft.world.entity.LivingEntity | grep -E "igniteForSeconds|setRemainingFireTicks|hurt|hurtServer|level\(|damageSources|addEffect|getX\(|isAlive|tickCount|getOwner"
          echo "== Level/DamageSources"; javap -cp "$J" -protected net.minecraft.world.damagesource.DamageSources | grep -E "thrown"
          javap -cp "$J" -protected net.minecraft.world.entity.player.Player | grep -E "getXRot|getYRot"
          javap -cp "$J" -protected net.minecraft.world.item.Item\$Properties | grep -E "setId"
          javap -cp "$J" -protected net.minecraft.resources.Identifier | grep -E "fromNamespaceAndPath"
